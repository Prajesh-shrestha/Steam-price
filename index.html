<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lowest Price Steam Tracker</title>
    <!-- Connect our CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Lowest Price Tracker</h1>
        <p>Find the cheapest historical price for any game.</p>
        
        <!-- The Search Area -->
        <div class="search-box">
            <input type="text" id="gameInput" placeholder="Enter a game title (e.g. Batman)">
            <button id="searchBtn">Search</button>
        </div>

        <!-- The Empty Container for Results -->
        <div id="resultsContainer" class="results-area">
            <!-- JavaScript will put the prices here -->
        </div>
    </div>

    <!-- Connect our JavaScript file -->
    <script src="app.js"></script>
</body>
</html>
